<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Finder</title>
<meta name="description" content="Tell us what you're looking for and we'll find homes that match.">
<meta name="theme-color" content="#1f6f5c">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
  :root{
    --bg:#f5f1ea; --card:#ffffff; --ink:#1c2a27; --muted:#66756f; --line:#e3ddd2;
    --brand:#1f6f5c; --brand-dark:#155544; --brand-soft:#e3f0ec; --accent:#e39b2f;
    --danger:#c0412c; --radius:18px; --shadow:0 10px 30px rgba(28,42,39,.08);
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  html[lang="fa"]{ --font:"Vazirmatn",Tahoma,system-ui,sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  [hidden]{display:none!important}
  .wrap{max-width:720px;margin:0 auto;padding:20px 18px 40px}

  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
  .brand svg{width:30px;height:30px}
  .lang-btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;color:var(--muted)}
  .lang-btn:hover{border-color:var(--brand);color:var(--brand)}

  /* Landing */
  .landing{text-align:center;padding:36px 8px 10px}
  .hero-art{width:min(240px,62vw);margin:0 auto 18px;display:block}
  .landing h1{font-size:clamp(1.6rem,4.6vw,2.3rem);line-height:1.2;margin:0 0 12px;letter-spacing:-.02em}
  .landing p{color:var(--muted);max-width:480px;margin:0 auto 28px;font-size:1.02rem}
  .start-btn{display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:17px 32px;font-size:1.08rem;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(31,111,92,.32);transition:transform .15s,background .15s;animation:pulse 2.6s infinite}
  .start-btn:hover{background:var(--brand-dark);transform:translateY(-2px)}
  .start-btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  @keyframes pulse{0%,100%{box-shadow:0 10px 24px rgba(31,111,92,.32),0 0 0 0 rgba(31,111,92,.35)}50%{box-shadow:0 10px 24px rgba(31,111,92,.32),0 0 0 12px rgba(31,111,92,0)}}
  .hero-note{margin-top:16px;font-size:.86rem;color:var(--muted)}
  .resume-note{margin-top:10px;font-size:.86rem;color:var(--brand);font-weight:600}

  /* Wizard */
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 22px 22px;border:1px solid rgba(0,0,0,.03)}
  .progress-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:8px}
  .progress{height:6px;background:var(--brand-soft);border-radius:99px;overflow:hidden;margin-bottom:24px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#2f9a7f);border-radius:99px;transition:width .35s ease}
  .step-title{font-size:clamp(1.25rem,3.6vw,1.6rem);margin:0 0 6px;letter-spacing:-.01em;outline:none}
  .step-sub{color:var(--muted);margin:0 0 22px;font-size:.95rem}
  .step-body.enter{animation:slideIn .28s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .group{margin-bottom:22px}
  .group:last-child{margin-bottom:6px}
  .lbl{display:block;font-weight:600;font-size:.93rem;margin-bottom:8px}
  .lbl small{font-weight:400;color:var(--muted)}
  .err{display:block;color:var(--danger);font-size:.84rem;margin-top:6px;min-height:0}
  .err:empty{display:none}

  input[type=text],input[type=tel],input[type=email],textarea{width:100%;border:1.5px solid var(--line);background:#fcfbf8;border-radius:12px;padding:13px 14px;font-size:1rem;transition:border-color .15s,box-shadow .15s}
  textarea{min-height:110px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft);background:#fff}
  .invalid input,.invalid textarea{border-color:var(--danger)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:520px){.row2{grid-template-columns:1fr}}
  .ltr{direction:ltr;text-align:left}
  html[dir=rtl] .ltr{text-align:right}

  /* Choice cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;padding:16px 10px;border:1.5px solid var(--line);border-radius:16px;background:#fcfbf8;cursor:pointer;font-weight:600;font-size:.96rem;transition:all .15s;text-align:center}
  .card-opt .ico{font-size:1.9rem;line-height:1}
  .card-opt .desc{font-weight:400;font-size:.8rem;color:var(--muted)}
  .card-opt:hover{border-color:var(--brand);transform:translateY(-2px)}
  .card-opt[aria-checked=true]{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(31,111,92,.15)}
  .card-opt:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* Chips */
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fcfbf8;border-radius:999px;padding:9px 16px;cursor:pointer;font-size:.93rem;transition:all .15s}
  .chip:hover{border-color:var(--brand)}
  .chip[aria-checked=true],.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip .check{display:none}
  .chip[aria-pressed=true] .check{display:inline}

  /* Photos */
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #cfc7b8;border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer;background:#fcfbf8;transition:all .15s;color:var(--muted)}
  .drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .drop .big{font-size:2rem}
  .drop strong{color:var(--ink)}
  .drop input{display:none}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:14px}
  .thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#eee;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:6px;inset-inline-end:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:1rem;line-height:1}
  .thumb.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#eee,#f7f7f7,#eee);background-size:200% 100%;animation:shimmer 1s infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  .hint{font-size:.83rem;color:var(--muted);margin-top:8px}

  /* Review */
  .review{display:flex;flex-direction:column;gap:12px}
  .rv-sec{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .rv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .rv-head h3{margin:0;font-size:.95rem}
  .rv-edit{background:none;border:0;color:var(--brand);cursor:pointer;font-weight:600;font-size:.86rem;padding:4px}
  .rv-row{display:flex;justify-content:space-between;gap:14px;font-size:.92rem;padding:4px 0;border-top:1px dashed #eee7db}
  .rv-row:first-of-type{border-top:0}
  .rv-row span:first-child{color:var(--muted)}
  .rv-row span:last-child{text-align:end;font-weight:500;word-break:break-word}
  .rv-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .rv-thumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px}

  /* Footer nav */
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid #f0ebe2}
  .btn{border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-size:.98rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--brand);color:#fff;margin-inline-start:auto}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:transparent;color:var(--muted);padding-inline:10px}
  .btn-ghost:hover{color:var(--ink)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  html[dir=rtl] .arrow{transform:scaleX(-1)}

  /* Status screens */
  .status{text-align:center;padding:30px 10px}
  .status .icon{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:2.2rem}
  .status.ok .icon{background:var(--brand-soft);color:var(--brand)}
  .status.bad .icon{background:#fbe8e4;color:var(--danger)}
  .status h2{margin:0 0 8px}
  .status p{color:var(--muted);margin:0 auto 22px;max-width:420px}
  .status .ref{font-size:.8rem;color:var(--muted);direction:ltr}
  .spinner{width:46px;height:46px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:10px auto 18px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hp{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;opacity:0;pointer-events:none}
  footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:26px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1f6f5c"/><path d="M8 16.5 16 9l8 7.5V24a1 1 0 0 1-1 1h-4.5v-5h-5v5H9a1 1 0 0 1-1-1z" fill="#fff"/><circle cx="23.5" cy="9.5" r="2.5" fill="#e39b2f"/></svg>
      <span data-i18n="brand"></span>
    </div>
    <button class="lang-btn" id="langBtn" type="button"></button>
  </header>

  <!-- Landing -->
  <section id="viewLanding" class="landing">
    <svg class="hero-art" viewBox="0 0 240 170" aria-hidden="true">
      <ellipse cx="120" cy="155" rx="100" ry="10" fill="#e6dfd2"/>
      <rect x="50" y="70" width="110" height="82" rx="6" fill="#fff" stroke="#1c2a27" stroke-width="3"/>
      <path d="M38 78 105 26l67 52" fill="none" stroke="#1c2a27" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44 74 105 27l61 47v6H44z" fill="#1f6f5c"/>
      <rect x="92" y="104" width="26" height="48" rx="3" fill="#e39b2f"/>
      <rect x="64" y="92" width="20" height="18" rx="3" fill="#e3f0ec" stroke="#1c2a27" stroke-width="2.5"/>
      <rect x="128" y="92" width="20" height="18" rx="3" fill="#e3f0ec" stroke="#1c2a27" stroke-width="2.5"/>
      <circle cx="180" cy="112" r="24" fill="#fff" stroke="#1c2a27" stroke-width="3"/>
      <circle cx="180" cy="112" r="14" fill="#e3f0ec"/>
      <path d="m197 129 18 18" stroke="#1c2a27" stroke-width="6" stroke-linecap="round"/>
      <circle cx="196" cy="40" r="4" fill="#e39b2f"/><circle cx="40" cy="44" r="3" fill="#1f6f5c"/><circle cx="214" cy="70" r="2.5" fill="#1f6f5c"/>
    </svg>
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_sub"></p>
    <button class="start-btn" id="startBtn" type="button">
      <span data-i18n="start"></span>
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div class="hero-note" data-i18n="hero_note"></div>
    <div class="resume-note" id="resumeNote" data-i18n="resume_note" hidden></div>
  </section>

  <!-- Wizard -->
  <section id="viewWizard" class="panel" hidden>
    <div class="progress-meta"><span id="stepCount"></span><span id="stepPct"></span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar"><i id="progressFill" style="width:0"></i></div>
    <form id="form" novalidate autocomplete="on">
      <h2 class="step-title" id="stepTitle" tabindex="-1"></h2>
      <p class="step-sub" id="stepSub"></p>
      <div class="step-body" id="stepBody"></div>
      <!-- Honeypot (spam trap) -->
      <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" id="hpField" tabindex="-1" autocomplete="off"></label></div>
      <div class="nav">
        <button type="button" class="btn btn-ghost" id="backBtn">
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
          <span data-i18n="back"></span>
        </button>
        <button type="submit" class="btn btn-primary" id="nextBtn"></button>
      </div>
    </form>
  </section>

  <!-- Sending -->
  <section id="viewSending" class="panel status" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <h2 data-i18n="sending"></h2>
  </section>

  <!-- Success -->
  <section id="viewSuccess" class="panel status ok" hidden>
    <div class="icon" aria-hidden="true">✓</div>
    <h2 data-i18n="success_title"></h2>
    <p id="successText"></p>
    <button class="btn btn-primary" style="margin:0 auto" type="button" id="restartBtn"><span data-i18n="start_over"></span></button>
    <p class="ref" id="successRef"></p>
  </section>

  <!-- Error -->
  <section id="viewError" class="panel status bad" hidden>
    <div class="icon" aria-hidden="true">!</div>
    <h2 data-i18n="error_title"></h2>
    <p id="errorText"></p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-ghost" type="button" id="errBackBtn"><span data-i18n="back_to_review"></span></button>
      <button class="btn btn-primary" style="margin:0" type="button" id="retryBtn"><span data-i18n="retry"></span></button>
    </div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

/* =========================================================================
   FORM SCHEMA — steps & fields
   field types: cards | chips | multi | text | tel | email | money | number | textarea | photos
   ========================================================================= */
const isRent = d => d.goal === 'rent' || d.goal === 'mortgage';
const STEPS = [
  { id:'goal', fields:[
    { name:'goal', type:'cards', required:true, autoNext:true, options:[{v:'buy',icon:'🏡'},{v:'rent',icon:'🔑'},{v:'mortgage',icon:'📝'}] }
  ]},
  { id:'type', fields:[
    { name:'propertyType', type:'cards', required:true, autoNext:true, options:[
      {v:'apartment',icon:'🏢'},{v:'house',icon:'🏠'},{v:'villa',icon:'🌳'},{v:'land',icon:'🗺️'},{v:'commercial',icon:'🏪'},{v:'office',icon:'💼'}] }
  ]},
  { id:'location', fields:[
    { name:'city', type:'text', required:true, autocomplete:'address-level2' },
    { name:'neighborhoods', type:'text' }
  ]},
  { id:'budget', fields:[
    { name:'currency', type:'chips', required:true, def:'toman', options:['toman','usd','eur'] },
    { name:'budgetMin', type:'money', half:true, when:d=>d.goal==='buy' },
    { name:'budgetMax', type:'money', half:true, required:true, minOf:'budgetMin', when:d=>d.goal==='buy' },
    { name:'deposit', type:'money', half:true, required:true, when:isRent },
    { name:'monthlyRent', type:'money', half:true, required:true, when:d=>d.goal==='rent' }
  ]},
  { id:'specs', fields:[
    { name:'bedrooms', type:'chips', required:true, options:['0','1','2','3','4+'], when:d=>!['land'].includes(d.propertyType) },
    { name:'areaMin', type:'number' },
    { name:'buildingAge', type:'chips', options:['new','1-5','5-10','10+','any'], when:d=>d.propertyType!=='land' },
    { name:'floor', type:'chips', options:['low','mid','high','any'], when:d=>['apartment','office','commercial'].includes(d.propertyType) }
  ]},
  { id:'features', when:d=>d.propertyType!=='land', fields:[
    { name:'features', type:'multi', options:['parking','elevator','storage','balcony','pool','gym','security','furnished','pets','view','garden','renovated'],
      icons:{parking:'🚗',elevator:'🛗',storage:'📦',balcony:'🌤️',pool:'🏊',gym:'🏋️',security:'🛡️',furnished:'🛋️',pets:'🐾',view:'🌇',garden:'🌿',renovated:'✨'} }
  ]},
  { id:'photos', optional:true, fields:[ { name:'photos', type:'photos' } ]},
  { id:'timing', fields:[
    { name:'timeline', type:'chips', required:true, options:['asap','1m','3m','6m','exploring'] },
    { name:'notes', type:'textarea' }
  ]},
  { id:'contact', fields:[
    { name:'fullName', type:'text', required:true, autocomplete:'name' },
    { name:'phone', type:'tel', required:true, autocomplete:'tel', half:true },
    { name:'email', type:'email', autocomplete:'email', half:true },
    { name:'contactMethod', type:'chips', required:true, def:'call', options:['call','whatsapp','telegram','sms','email'] },
    { name:'contactTime', type:'chips', options:['morning','afternoon','evening','any'] }
  ]},
  { id:'review', fields:[] }
];

/* =========================================================================
   STATE
   ========================================================================= */
const DRAFT_KEY = 'homeFinderDraft.v1';
const state = {
  lang: CONFIG.DEFAULT_LANG,
  step: 0,
  data: {},
  photos: [],            // {id, blob, name, type, size, width, height, url, originalName, originalSize}
  events: [],
  startedAt: null,
  submissionId: null,
  sending: false
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toLatinDigits = s => String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

function t(key, vars){
  const parts = key.split('.');
  let v = parts.reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), I18N[state.lang]);
  if (v === undefined) v = parts.reduce((o, k) => (o && o[k] !== undefined ? o[k] : undefined), I18N.en);
  if (typeof v !== 'string') return v ?? key;
  return vars ? v.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : v;
}
function optLabel(field, v){ const o = t('o.' + field + '.' + v); return Array.isArray(o) ? o[0] : o; }
function optDesc(field, v){ const o = t('o.' + field + '.' + v); return Array.isArray(o) ? (o[1] || '') : ''; }
function fmtNum(n){
  if (n === '' || n == null) return '';
  const s = Number(n).toLocaleString('en-US');
  return state.lang === 'fa' ? s.replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]) : s;
}

/* Activity log — every meaningful user action is recorded and sent to n8n */
function log(type, detail = {}){
  state.events.push({ at: new Date().toISOString(), type, step: STEPS[state.step]?.id, ...detail });
  if (state.events.length > 400) state.events.splice(0, state.events.length - 400);
}

/* Draft persistence (answers only; photos are not stored) */
let saveTimer;
function saveDraft(){
  if (!CONFIG.SAVE_DRAFT) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ data: state.data, step: state.step, lang: state.lang, startedAt: state.startedAt, events: state.events.slice(-150) })); } catch(e){}
  }, 250);
}
function loadDraft(){
  if (!CONFIG.SAVE_DRAFT) return null;
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch(e){ return null; }
}
function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(e){} }

/* =========================================================================
   STEP HELPERS
   ========================================================================= */
const activeSteps = () => STEPS.filter(s => !s.when || s.when(state.data));
const currentStep = () => activeSteps()[state.step];
const visibleFields = step => step.fields.filter(f => !f.when || f.when(state.data));

function applyDefaults(step){
  visibleFields(step).forEach(f => { if (f.def !== undefined && (state.data[f.name] === undefined || state.data[f.name] === '')) state.data[f.name] = f.def; });
}
function hasValue(v){ return Array.isArray(v) ? v.length > 0 : v !== undefined && v !== null && String(v).trim() !== ''; }

/* =========================================================================
   VIEWS
   ========================================================================= */
function showView(name){
  ['Landing','Wizard','Sending','Success','Error'].forEach(v => { $('#view' + v).hidden = v !== name; });
  state.view = name;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function applyLang(){
  const html = document.documentElement;
  html.lang = state.lang;
  html.dir = state.lang === 'fa' ? 'rtl' : 'ltr';
  document.title = t('brand');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#langBtn').textContent = t('lang_switch');
  if (state.view === 'Wizard') renderStep(false);
  if (state.view === 'Success') renderSuccess();
}

/* =========================================================================
   RENDER A STEP
   ========================================================================= */
function renderField(f){
  const val = state.data[f.name];
  const label = t('f.' + f.name);
  const opt = !f.required && f.type !== 'cards' && f.type !== 'multi' && f.type !== 'photos' ? ` <small>(${esc(t('optional'))})</small>` : '';
  const lbl = typeof label === 'string' && label !== 'f.' + f.name && label ? `<span class="lbl" id="lbl-${f.name}">${esc(label)}${opt}</span>` : '';
  const err = `<span class="err" id="err-${f.name}" role="alert"></span>`;
  const ph = t('ph.' + f.name); const placeholder = ph && ph !== 'ph.' + f.name ? esc(ph) : '';

  switch (f.type){
    case 'cards':
      return `<div class="group" data-group="${f.name}">${lbl}
        <div class="cards" role="radiogroup" data-field="${f.name}" data-kind="single" aria-label="${esc(t('steps.' + currentStep().id)[0])}">
          ${f.options.map(o => `<button type="button" class="card-opt" role="radio" aria-checked="${val === o.v}" data-value="${esc(o.v)}">
            <span class="ico" aria-hidden="true">${o.icon}</span><span>${esc(optLabel(f.name, o.v))}</span>
            ${optDesc(f.name, o.v) ? `<span class="desc">${esc(optDesc(f.name, o.v))}</span>` : ''}</button>`).join('')}
        </div>${err}</div>`;
    case 'chips':
      return `<div class="group" data-group="${f.name}">${lbl}
        <div class="chips" role="radiogroup" data-field="${f.name}" data-kind="single" aria-labelledby="lbl-${f.name}">
          ${f.options.map(v => `<button type="button" class="chip" role="radio" aria-checked="${val === v}" data-value="${esc(v)}">${esc(optLabel(f.name, v))}</button>`).join('')}
        </div>${err}</div>`;
    case 'multi': {
      const arr = Array.isArray(val) ? val : [];
      return `<div class="group" data-group="${f.name}">${lbl}
        <div class="chips" data-field="${f.name}" data-kind="multi">
          ${f.options.map(v => `<button type="button" class="chip" aria-pressed="${arr.includes(v)}" data-value="${esc(v)}">
            <span aria-hidden="true">${f.icons?.[v] || ''}</span>${esc(optLabel(f.name, v))}<span class="check" aria-hidden="true">✓</span></button>`).join('')}
        </div>${err}</div>`;
    }
    case 'textarea':
      return `<label class="group" data-group="${f.name}">${lbl}<textarea name="${f.name}" data-input="${f.name}" placeholder="${placeholder}" maxlength="2000">${esc(val || '')}</textarea>${err}</label>`;
    case 'money':
    case 'number': {
      const shown = val !== undefined && val !== '' ? fmtNum(val) : '';
      const unit = f.type === 'money' ? ` <small>(${esc(optLabel('currency', state.data.currency || 'toman'))})</small>` : '';
      const l = `<span class="lbl" id="lbl-${f.name}">${esc(label)}${unit}${opt}</span>`;
      return `<label class="group" data-group="${f.name}">${l}<input type="text" inputmode="numeric" class="ltr" name="${f.name}" data-input="${f.name}" data-num="1" value="${esc(shown)}" placeholder="${placeholder}" autocomplete="off">${err}</label>`;
    }
    case 'photos': {
      const thumbs = state.photos.map(p => `<div class="thumb${p.url ? '' : ' loading'}" data-photo="${p.id}">
          ${p.url ? `<img src="${p.url}" alt="">` : ''}
          <button type="button" data-remove="${p.id}" aria-label="${esc(t('remove'))}">×</button></div>`).join('');
      return `<div class="group" data-group="photos">
        <label class="drop" id="dropZone">
          <span class="big" aria-hidden="true">📷</span>
          <strong>${esc(t('drop_title'))}</strong>
          <span>${esc(t('drop_sub', { max: CONFIG.MAX_PHOTOS }))}</span>
          <input type="file" id="photoInput" accept="image/*" multiple>
        </label>
        <div class="thumbs" id="thumbs">${thumbs}</div>${err}</div>`;
    }
    default: { // text / tel / email
      const cls = f.type === 'tel' || f.type === 'email' ? ' class="ltr"' : '';
      const im = f.type === 'tel' ? ' inputmode="tel"' : f.type === 'email' ? ' inputmode="email"' : '';
      return `<label class="group" data-group="${f.name}">${lbl}<input type="${f.type}"${cls}${im} name="${f.name}" data-input="${f.name}" value="${esc(val || '')}" placeholder="${placeholder}" autocomplete="${f.autocomplete || 'on'}" maxlength="200">${err}</label>`;
    }
  }
}

function renderStep(animate = true){
  const steps = activeSteps();
  if (state.step >= steps.length) state.step = steps.length - 1;
  const step = steps[state.step];
  applyDefaults(step);

  const n = state.step + 1, total = steps.length;
  const pct = Math.round((state.step / (total - 1)) * 100);
  $('#stepCount').textContent = t('step_of', { n: state.lang === 'fa' ? fmtNum(n) : n, t: state.lang === 'fa' ? fmtNum(total) : total });
  $('#stepPct').textContent = state.lang === 'fa' ? fmtNum(pct) + '٪' : pct + '%';
  $('#progressFill').style.width = pct + '%';
  $('#progressBar').setAttribute('aria-valuenow', pct);

  const [title, sub] = t('steps.' + step.id);
  $('#stepTitle').textContent = title;
  $('#stepSub').textContent = sub || '';
  $('#stepSub').hidden = !sub;

  const body = $('#stepBody');
  if (step.id === 'review') {
    body.innerHTML = renderReview();
  } else {
    // pair "half" fields into two-column rows
    const fields = visibleFields(step);
    let html = '';
    for (let i = 0; i < fields.length; i++){
      if (fields[i].half && fields[i + 1]?.half){ html += `<div class="row2">${renderField(fields[i])}${renderField(fields[i + 1])}</div>`; i++; }
      else html += renderField(fields[i]);
    }
    body.innerHTML = html;
  }
  if (animate){ body.classList.remove('enter'); void body.offsetWidth; body.classList.add('enter'); }

  $('#backBtn').style.visibility = state.step === 0 ? 'hidden' : 'visible';
  updateNextLabel();
  if (step.id === 'photos') bindPhotoInputs();
  if (animate) setTimeout(() => $('#stepTitle').focus({ preventScroll: true }), 30);
}

function updateNextLabel(){
  const step = currentStep();
  const isLast = step.id === 'review';
  const empty = step.optional && !visibleFields(step).some(f => f.type === 'photos' ? state.photos.length : hasValue(state.data[f.name]));
  const label = isLast ? t('submit') : empty ? t('skip') : t('next');
  $('#nextBtn').innerHTML = `<span>${esc(label)}</span>` + (isLast ? '' :
    '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>');
}

/* =========================================================================
   REVIEW
   ========================================================================= */
function displayValue(f, v){
  if (!hasValue(v)) return null;
  if (f.type === 'cards' || f.type === 'chips') return optLabel(f.name, v);
  if (f.type === 'multi') return v.map(x => optLabel(f.name, x)).join(state.lang === 'fa' ? '، ' : ', ');
  if (f.type === 'money') return fmtNum(v) + ' ' + optLabel('currency', state.data.currency || 'toman');
  if (f.type === 'number') return fmtNum(v);
  return String(v);
}
function fieldTitle(f, step){
  const l = t('f.' + f.name);
  return (typeof l === 'string' && l !== 'f.' + f.name) ? l : t('steps.' + step.id)[0];
}
function renderReview(){
  const steps = activeSteps();
  return '<div class="review">' + steps.filter(s => s.id !== 'review').map(s => {
    const idx = steps.indexOf(s);
    let rows = '';
    visibleFields(s).forEach(f => {
      if (f.type === 'photos'){
        rows += `<div class="rv-row"><span>${esc(t('steps.photos')[0])}</span><span>${state.photos.length ? esc(t('photos_count', { n: state.lang === 'fa' ? fmtNum(state.photos.length) : state.photos.length })) : esc(t('none'))}</span></div>`;
        if (state.photos.length) rows += `<div class="rv-thumbs">${state.photos.filter(p => p.url).map(p => `<img src="${p.url}" alt="">`).join('')}</div>`;
        return;
      }
      if (f.name === 'currency') return;
      const dv = displayValue(f, state.data[f.name]);
      if (dv === null) return;
      rows += `<div class="rv-row"><span>${esc(fieldTitle(f, s))}</span><span>${esc(dv)}</span></div>`;
    });
    if (!rows) return '';
    return `<div class="rv-sec"><div class="rv-head"><h3>${esc(t('steps.' + s.id)[0])}</h3>
      <button type="button" class="rv-edit" data-goto="${idx}">${esc(t('edit'))}</button></div>${rows}</div>`;
  }).join('') + '</div>';
}

/* =========================================================================
   VALIDATION
   ========================================================================= */
function setError(name, msg){
  const el = document.getElementById('err-' + name);
  if (el) el.textContent = msg || '';
  const g = document.querySelector(`[data-group="${name}"]`);
  if (g) g.classList.toggle('invalid', !!msg);
}
function validateStep(){
  const step = currentStep();
  let firstBad = null;
  visibleFields(step).forEach(f => {
    const v = state.data[f.name];
    let msg = '';
    if (f.required && !hasValue(v)) msg = (f.type === 'cards' || f.type === 'chips') ? t('choose_one') : f.type === 'multi' ? t('choose_some') : t('required');
    else if (f.type === 'tel' && hasValue(v)){
      const digits = toLatinDigits(v).replace(/\D/g, '');
      if (digits.length < 7 || digits.length > 15 || !/^[+\d\s()\-]+$/.test(toLatinDigits(v).trim())) msg = t('invalid_phone');
    }
    else if (f.type === 'email' && hasValue(v) && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim())) msg = t('invalid_email');
    else if (f.minOf && hasValue(v) && hasValue(state.data[f.minOf]) && Number(v) < Number(state.data[f.minOf])) msg = t('range_error');
    setError(f.name, msg);
    if (msg && !firstBad) firstBad = f.name;
  });
  if (firstBad){
    log('validation_error', { field: firstBad });
    const g = document.querySelector(`[data-group="${firstBad}"]`);
    g?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    g?.querySelector('input,textarea,button')?.focus({ preventScroll: true });
    return false;
  }
  return true;
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
function goTo(index, reason){
  const from = currentStep()?.id;
  state.step = Math.max(0, Math.min(index, activeSteps().length - 1));
  log('step_view', { from, reason });
  renderStep();
  saveDraft();
}
function next(){
  if (state.sending) return;
  if (!validateStep()) return;
  const step = currentStep();
  if (step.id === 'review') return submit();
  log('step_complete', { values: snapshot(step) });
  goTo(state.step + 1, 'next');
}
function back(){ if (state.step > 0) goTo(state.step - 1, 'back'); }
function snapshot(step){
  const o = {};
  visibleFields(step).forEach(f => { o[f.name] = f.type === 'photos' ? state.photos.length : state.data[f.name]; });
  return o;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function bindEvents(){
  $('#startBtn').addEventListener('click', () => {
    if (!state.startedAt) state.startedAt = new Date().toISOString();
    log('start_clicked');
    showView('Wizard');
    renderStep();
    saveDraft();
  });
  $('#langBtn').addEventListener('click', () => {
    state.lang = state.lang === 'en' ? 'fa' : 'en';
    log('language_changed', { to: state.lang });
    applyLang(); saveDraft();
  });
  $('#form').addEventListener('submit', e => { e.preventDefault(); next(); });
  $('#backBtn').addEventListener('click', back);
  $('#retryBtn').addEventListener('click', () => { log('retry'); submit(); });
  $('#errBackBtn').addEventListener('click', () => { showView('Wizard'); renderStep(); });
  $('#restartBtn').addEventListener('click', resetAll);

  const body = $('#stepBody');
  body.addEventListener('click', e => {
    const goto = e.target.closest('[data-goto]');
    if (goto){ goTo(Number(goto.dataset.goto), 'edit_from_review'); return; }

    const rm = e.target.closest('[data-remove]');
    if (rm){ e.preventDefault(); removePhoto(rm.dataset.remove); return; }

    const btn = e.target.closest('[data-value]');
    const group = btn?.closest('[data-field]');
    if (!btn || !group) return;
    const name = group.dataset.field, v = btn.dataset.value;

    if (group.dataset.kind === 'multi'){
      const arr = Array.isArray(state.data[name]) ? [...state.data[name]] : [];
      const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v);
      state.data[name] = arr;
      btn.setAttribute('aria-pressed', arr.includes(v));
      log('toggle', { field: name, value: v, selected: arr.includes(v) });
    } else {
      state.data[name] = v;
      group.querySelectorAll('[data-value]').forEach(b => b.setAttribute('aria-checked', b === btn));
      log('select', { field: name, value: v });
      if (name === 'currency') renderStep(false); // refresh currency units on money fields
      const f = currentStep().fields.find(x => x.name === name);
      if (f?.autoNext && visibleFields(currentStep()).length === 1) setTimeout(next, 260);
    }
    setError(name, '');
    updateNextLabel();
    saveDraft();
  });

  body.addEventListener('input', e => {
    const el = e.target.closest('[data-input]');
    if (!el) return;
    const name = el.dataset.input;
    if (el.dataset.num){
      const digits = toLatinDigits(el.value).replace(/\D/g, '').slice(0, 16);
      state.data[name] = digits ? digits.replace(/^0+(?=\d)/, '') : '';
      el.value = digits ? fmtNum(state.data[name]) : '';
    } else {
      state.data[name] = el.value;
    }
    setError(name, '');
    updateNextLabel();
    saveDraft();
  });
  body.addEventListener('change', e => {
    const el = e.target.closest('[data-input]');
    if (el) log('input', { field: el.dataset.input, value: el.dataset.input === 'notes' ? `[${String(state.data.notes || '').length} chars]` : state.data[el.dataset.input] });
  });
  // Enter in a single-line input = Continue (handled by form submit). Prevent Enter on choice buttons from double-firing.
  body.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('button[data-value]')){ e.preventDefault(); e.target.click(); }
  });
}

/* =========================================================================
   PHOTOS — resize & compress in the browser before upload
   ========================================================================= */
function bindPhotoInputs(){
  const input = $('#photoInput'), zone = $('#dropZone');
  if (!input) return;
  input.addEventListener('change', () => { addPhotos([...input.files]); input.value = ''; });
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('over'); }));
  zone.addEventListener('drop', e => addPhotos([...(e.dataTransfer?.files || [])]));
}

async function addPhotos(files){
  setError('photos', '');
  const room = CONFIG.MAX_PHOTOS - state.photos.length;
  if (files.length > room) setError('photos', t('photo_limit', { max: CONFIG.MAX_PHOTOS }));
  const accepted = [];
  for (const file of files.slice(0, Math.max(0, room))){
    if (!file.type.startsWith('image/') && !/\.(heic|heif)$/i.test(file.name)){ setError('photos', t('photo_type', { name: file.name })); continue; }
    if (file.size > CONFIG.MAX_PHOTO_MB * 1024 * 1024){ setError('photos', t('photo_big', { name: file.name, mb: CONFIG.MAX_PHOTO_MB })); continue; }
    const p = { id: uid(), originalName: file.name, originalSize: file.size, url: null };
    state.photos.push(p); accepted.push([p, file]);
  }
  if (!accepted.length) return;
  refreshThumbs();
  for (const [p, file] of accepted){
    const r = await compressImage(file);
    Object.assign(p, r, { url: URL.createObjectURL(r.blob) });
    log('photo_added', { name: p.originalName, originalSize: p.originalSize, uploadSize: p.size, width: p.width, height: p.height });
    if (state.photos.includes(p)) refreshThumbs(); else URL.revokeObjectURL(p.url);
  }
}

function compressImage(file){
  return new Promise(resolve => {
    const fallback = () => resolve({ blob: file, name: file.name, type: file.type || 'application/octet-stream', size: file.size, width: null, height: null });
    const src = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, CONFIG.MAX_PHOTO_DIMENSION / Math.max(w, h));
      const cw = Math.round(w * scale), ch = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      canvas.toBlob(blob => {
        URL.revokeObjectURL(src);
        if (!blob || (scale === 1 && blob.size >= file.size && /jpe?g|webp/i.test(file.type))){
          return resolve({ blob: file, name: file.name, type: file.type, size: file.size, width: w, height: h });
        }
        resolve({ blob, name: file.name.replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', size: blob.size, width: cw, height: ch });
      }, 'image/jpeg', CONFIG.PHOTO_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(src); fallback(); };
    img.src = src;
  });
}

function refreshThumbs(){
  const box = $('#thumbs');
  if (!box) return;
  box.innerHTML = state.photos.map(p => `<div class="thumb${p.url ? '' : ' loading'}">
      ${p.url ? `<img src="${p.url}" alt="">` : ''}
      <button type="button" data-remove="${p.id}" aria-label="${esc(t('remove'))}">×</button></div>`).join('');
  updateNextLabel();
}
function removePhoto(id){
  const i = state.photos.findIndex(p => p.id === id);
  if (i < 0) return;
  const [p] = state.photos.splice(i, 1);
  if (p.url) URL.revokeObjectURL(p.url);
  log('photo_removed', { name: p.originalName });
  setError('photos', '');
  refreshThumbs();
}

/* =========================================================================
   SUBMIT TO n8n
   ========================================================================= */
function buildPayload(){
  const steps = activeSteps();
  // answers = values in the form's current language (fa → فارسی, en → English)
  // codes   = language-independent codes (buy, parking, 1-5 …) for logic in n8n
  const answers = {}, codes = {}, readable = {};
  steps.forEach(s => visibleFields(s).forEach(f => {
    if (f.type === 'photos') return;
    const v = state.data[f.name];
    if (!hasValue(v)) return;
    let localized;
    if (f.type === 'money' || f.type === 'number') localized = Number(v);
    else if (f.type === 'tel') localized = toLatinDigits(v).trim();
    else if (f.type === 'cards' || f.type === 'chips') localized = optLabel(f.name, v);
    else if (f.type === 'multi') localized = v.map(x => optLabel(f.name, x));
    else localized = String(v).trim();
    answers[f.name] = localized;
    codes[f.name] = (f.type === 'money' || f.type === 'number') ? Number(v) : (f.type === 'tel' ? localized : v);
    readable[fieldTitle(f, s)] = displayValue(f, v);
  }));
  const params = new URLSearchParams(location.search);
  const utm = {};
  ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','ref'].forEach(k => { if (params.get(k)) utm[k] = params.get(k); });
  const now = new Date();
  return {
    submissionId: state.submissionId,
    submittedAt: now.toISOString(),
    language: state.lang,
    source: CONFIG.SOURCE,
    answers,
    codes,
    readable,
    photos: state.photos.map((p, i) => ({ field: 'photo_' + (i + 1), fileName: p.name, mimeType: p.type, size: p.size, width: p.width, height: p.height, originalName: p.originalName, originalSize: p.originalSize })),
    meta: {
      startedAt: state.startedAt,
      durationSec: state.startedAt ? Math.round((now - new Date(state.startedAt)) / 1000) : null,
      pageUrl: location.href, referrer: document.referrer || null, utm,
      userAgent: navigator.userAgent, browserLanguage: navigator.language,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      screen: `${screen.width}x${screen.height}`, viewport: `${innerWidth}x${innerHeight}`
    },
    activity: state.events
  };
}

async function submit(){
  if (state.sending) return;
  if ($('#hpField').value){ showView('Success'); renderSuccess(); return; } // bot trap
  if (!CONFIG.WEBHOOK_URL || CONFIG.WEBHOOK_URL.includes('YOUR-N8N-DOMAIN')){
    $('#errorText').textContent = t('not_configured'); showView('Error'); return;
  }
  // wait for any photo still processing
  if (state.photos.some(p => !p.url)) { setTimeout(submit, 300); return; }

  state.sending = true;
  state.submissionId = state.submissionId || uid();
  log('submit_attempt');
  showView('Sending');

  const payload = buildPayload();
  const fd = new FormData();
  fd.append('payload', JSON.stringify(payload));
  fd.append('submissionId', payload.submissionId);
  Object.entries(payload.answers).forEach(([k, v]) => fd.append(k, Array.isArray(v) ? v.join(',') : String(v)));
  state.photos.forEach((p, i) => fd.append('photo_' + (i + 1), p.blob, p.name));

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.WEBHOOK_URL, { method: 'POST', body: fd, signal: ctrl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    log('submit_success', { status: res.status });
    clearDraft();
    showView('Success'); renderSuccess();
  } catch (err) {
    log('submit_error', { message: String(err && err.message || err) });
    $('#errorText').textContent = err.name === 'AbortError' ? t('timeout') : t('error_sub');
    showView('Error');
  } finally {
    clearTimeout(timer);
    state.sending = false;
  }
}

function renderSuccess(){
  const name = (state.data.fullName || '').trim().split(/\s+/)[0];
  $('#successText').textContent = t('success_sub', { name: name ? (state.lang === 'fa' ? ' ' + name + ' عزیز' : ', ' + name) : '' });
  $('#successRef').textContent = state.submissionId ? 'Ref: ' + state.submissionId.slice(0, 8).toUpperCase() : '';
}

function resetAll(){
  state.photos.forEach(p => p.url && URL.revokeObjectURL(p.url));
  Object.assign(state, { step: 0, data: {}, photos: [], events: [], startedAt: null, submissionId: null });
  clearDraft();
  $('#resumeNote').hidden = true;
  showView('Landing');
}

/* =========================================================================
   INIT
   ========================================================================= */
(function init(){
  const params = new URLSearchParams(location.search);
  const draft = loadDraft();
  if (draft && draft.data && Object.keys(draft.data).length){
    Object.assign(state, { data: draft.data, step: draft.step || 0, startedAt: draft.startedAt, events: draft.events || [], lang: draft.lang || state.lang });
    $('#resumeNote').hidden = false;
  }
  if (params.get('lang') === 'fa' || params.get('lang') === 'en') state.lang = params.get('lang');
  state.view = 'Landing';
  bindEvents();
  applyLang();
  log('page_view');
})();
</script>
